name: docker

# 构建并推送 Centurion 多架构镜像（linux/amd64 + linux/arm64）到 GHCR：
#   ghcr.io/<owner>/centurion:build-<N>   （每次推送，N = git 提交计数）
#   ghcr.io/<owner>/centurion:latest      （最新一次）
# 用法见 docs/install.md 的 Docker 章节。

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build number
        id: build
        shell: bash
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute lowercase image name (GHCR requires lowercase)
        id: img
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:build-${{ steps.build.outputs.number }}
            ${{ steps.img.outputs.name }}:latest
          build-args: |
            CENTURION_BUILD_NUMBER=${{ steps.build.outputs.number }}
