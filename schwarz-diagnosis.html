<html style="margin:0;padding:0;">
<title>黑色火焰 ASR 诊断：人声分离完整、ASR 长音频丢段</title>
<div style="font-family:'Segoe UI','Microsoft YaHei',sans-serif;max-width:1080px;margin:16px auto;padding:0 16px;">
<div style="background:#f6f8fa;border:1px solid #d8dee4;border-radius:10px;padding:14px 18px;margin-bottom:16px;">
<b style="font-size:15px;">TFR - Schwarz Flammen（4:45，前奏+尾声完整）</b><br>
<span style="font-size:13px;color:#57606a;">人声分离（htdemucs）输出 vocals 305.4s 完整无截断——VAD 检出开头 1.2s 起的全部语音段，<b style="color:#1a7f37;">分离层没有丢语音</b>。真正的失效在 ASR 长音频一次性转写：尾部 20s 尾声未转写、两处中段语音漏输出、前奏被转成 "."。</span>
</div>

  <!-- 泳道 1: VAD 语音段（人声轨） -->
  <text x="14" y="92" font-size="12" fill="#24292f">人声轨 VAD 语音段</text>

  <text x="80" y="260" font-size="12" fill="#d29922">前奏（约 0-45s 器乐/氛围）：ASR 转成 "."，无歌词——可接受，但可后续用 VAD 过滤</text>

  <text x="80" y="288" font-size="12" fill="#d29922">尾声（约 285-305s）：ASR 只转写 285s，尾部 20s 未进转写——CrispASR 长音频截断</text>
  <text x="80" y="316" font-size="12" fill="#d1242f">91-98s / 187-204s：VAD 有语音（德语低语段），ASR 无对应输出——长音频一次性转写的漏段</text>
  <text x="80" y="342" font-size="13" fill="#1a7f37">已修复：字幕每句前多一个词 = 分句逻辑首词双加（GroupIntoSentences），本次已根除</text>
  <text x="80" y="364" font-size="12" fill="#57606a">剩余建议：ASR 分段转写（chunking）解决截断/漏段——见本次交付说明</text>
